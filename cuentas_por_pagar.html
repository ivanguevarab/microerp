<!DOCTYPE html>
<html lang="es" class="">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas por Pagar - MICRO ERP</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Supabase & Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-guard.js"></script>

    <!-- Styles y Theme -->
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        .card-stat {
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .data-table th { background-color: #f8fafc; color: #475569; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; padding: 12px 16px; border-bottom: 2px solid #e2e8f0; text-align: left; }
        .data-table td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; font-size: 0.875rem; color: #334155; background-color: white; }
        .data-table tbody tr:hover td { background-color: #f1f5f9; }

        /* MODO OSCURO (Dark Premium SaaS) */
        html.dark body { background-color: #020617 !important; color: #e2e8f0 !important; }
        html.dark .submodule-header { background: #0f172a !important; border-bottom: 2px solid rgba(71, 85, 105, 0.5) !important; }
        
        html.dark .card-stat, html.dark .bg-white { background-color: #0f172a !important; border: 1px solid rgba(71, 85, 105, 0.5) !important; color: #e2e8f0 !important; }
        html.dark .text-slate-800, html.dark .text-gray-900 { color: #f8fafc !important; }
        html.dark .text-slate-500, html.dark .text-gray-500 { color: #94a3b8 !important; }
        html.dark .bg-slate-50, html.dark .bg-gray-50 { background-color: #1e293b !important; border-color: rgba(71, 85, 105, 0.5) !important; }

        html.dark .data-table th { background-color: #0f172a !important; border-bottom: 2px solid rgba(71, 85, 105, 0.5) !important; color: #94a3b8 !important; }
        html.dark .data-table td { background-color: transparent !important; border-bottom-color: rgba(71, 85, 105, 0.5) !important; color: #e2e8f0 !important; }
        html.dark .data-table tbody tr:hover td { background-color: rgba(51, 65, 85, 0.3) !important; }

        html.dark input[type="text"], html.dark input[type="number"], html.dark input[type="date"], html.dark select { 
            background-color: #1e293b !important; border-color: rgba(71, 85, 105, 0.5) !important; color: #f8fafc !important; 
        }
        html.dark .swal2-popup { background-color: #0f172a !important; color: #f8fafc !important; }
        html.dark .swal2-title { color: #f8fafc !important; }
        html.dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>

<body>
    <!-- Header Standarizado -->
    <header class="submodule-header">
        <div class="submodule-header-content">
            <button class="btn-back-std" onclick="window.location.href='finanzas.html'">
                ← Volver a Finanzas
            </button>
            <h1 class="flex items-center gap-2"><i class="fas fa-hand-holding-usd text-rose-400"></i> Cuentas por Pagar Comerciales</h1>
            
            <div id="fechaActualCaja" class="text-[0.7rem] font-bold tracking-widest uppercase text-slate-300 mt-2 z-10 relative"></div>
            <button id="themeToggleBtn" onclick="toggleTheme()" class="absolute right-[20px] top-[20px] px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 transition hover:bg-slate-100 dark:hover:bg-slate-700 shadow flex items-center gap-2 z-50">
                <i class="fas fa-sun text-amber-500 dark:hidden"></i>
                <i class="fas fa-moon text-blue-300 hidden dark:inline"></i>
                <span class="text-sm font-bold tracking-wide">TEMA</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative">
        
        <!-- Título -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h2 class="text-3xl font-bold text-slate-800 tracking-tight">Obligaciones a Proveedores</h2>
                <p class="text-sm text-slate-500 mt-1">Reporte central de compras e ingresos al crédito pendientes de pago</p>
            </div>
            <div>
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="buscadorGlobal" onkeyup="filtrarTabla()" class="w-64 pl-10 pr-3 py-2 border border-gray-300 rounded-lg outline-none text-sm shadow-sm" placeholder="Buscar proveedor o doc...">
                </div>
            </div>
        </div>

        <!-- KPIs Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card-stat border-l-4 border-rose-500 relative overflow-hidden">
                <div class="absolute right-0 top-0 opacity-10 text-rose-500 text-6xl -mr-4 -mt-4"><i class="fas fa-chart-pie"></i></div>
                <div class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 z-10">Deuda Global (Pasivos)</div>
                <div class="text-3xl font-bold text-rose-600 z-10" id="kpi-deuda-total">S/ 0.00</div>
            </div>

            <div class="card-stat border-l-4 border-blue-500 relative overflow-hidden">
                <div class="absolute right-0 top-0 opacity-10 text-blue-500 text-6xl -mr-4 -mt-4"><i class="fas fa-truck-loading"></i></div>
                <div class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 z-10">Proveedores por Pagar</div>
                <div class="text-3xl font-bold text-slate-800 z-10" id="kpi-proveedores">0</div>
            </div>

            <div class="card-stat border-l-4 border-amber-500 relative overflow-hidden">
                <div class="absolute right-0 top-0 opacity-10 text-amber-500 text-6xl -mr-4 -mt-4"><i class="fas fa-file-invoice"></i></div>
                <div class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mb-2 z-10">Compras Pendientes</div>
                <div class="text-3xl font-bold text-slate-800 z-10" id="kpi-tickets">0</div>
            </div>
        </div>

        <!-- Tabla Principal (Agrupada) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th width="35%">Proveedor / Razón Social</th>
                            <th width="15%">RUC / DNI</th>
                            <th width="15%" class="text-center">Ingresos Adeudados</th>
                            <th width="20%" class="text-right">Saldo Total Pendiente</th>
                            <th width="15%" class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaDeudores">
                        <!-- Inyectado por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="sidebar.js"></script>
    <script>
        let currentEmpresaId = null;
        let dataGlobalCartera = []; // Almacena array agrupado
        let dataGlobalTickets = []; // Almacena raw db (todos los ingresos deudores)

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            
            document.getElementById('fechaActualCaja').textContent = new Date().toLocaleDateString('es-PE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            if (typeof renderErpSidebar === 'function') renderErpSidebar(window.currentUser);
            
            // Check Theme
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }

            await cargarContextoInicial();
            await cargarCarteraDeudores();
        });

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function formatMoney(amount) {
            return Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function cargarContextoInicial() {
            const { data: perfil } = await window.supabaseClient.from('perfiles_usuario').select('empresa_id').eq('id', window.currentUser.id).single();
            currentEmpresaId = perfil.empresa_id;
        }

        async function cargarCarteraDeudores() {
            const tbody = document.getElementById('tablaDeudores');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-10 text-gray-500"><i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i><br>Analizando pasivos...</td></tr>';

            try {
                const { data: ingresos, error } = await window.supabaseClient.from('ingresos')
                    .select('id, numero_ingreso, numero_factura, serie_factura, fecha_ingreso, fecha_vencimiento, costo_adquisicion_total, saldo_credito, estado, proveedor_id, proveedores(id, razon_social, ruc)')
                    .eq('empresa_id', currentEmpresaId)
                    .eq('forma_pago', 'CREDITO')
                    .gt('saldo_credito', 0)
                    .order('fecha_ingreso', { ascending: false });

                if(error) throw error;

                // PostgREST descarta los NULL en las validaciones neq. Filtramos anulados en memoria por seguridad extra:
                const ingresosVigentes = (ingresos || []).filter(v => v.estado !== 'ANULADO');
                dataGlobalTickets = ingresosVigentes;
                procesarAgrupacionCartera(dataGlobalTickets);

            } catch (e) {
                console.error("Error al cargar cartera:", e);
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-red-500">Error de conexión al cargar la cartera de obligaciones.</td></tr>';
            }
        }

        function procesarAgrupacionCartera(tickets) {
            let mapDeudores = {};
            let globalDeudaTotal = 0;
            let globalTicketsTotal = 0;

            tickets.forEach(t => {
                const pid = t.proveedor_id;
                // Ignorar compras sin proveedor
                if(!pid) return;

                if (!mapDeudores[pid]) {
                    mapDeudores[pid] = {
                        proveedor_id: pid,
                        razon_social: t.proveedores?.razon_social || 'Desconocido',
                        numero_documento: t.proveedores?.ruc || 'S/D',
                        cantidad_tickets: 0,
                        deuda_total: 0,
                        tickets_detalle: []
                    };
                }

                mapDeudores[pid].cantidad_tickets += 1;
                mapDeudores[pid].deuda_total += Number(t.saldo_credito);
                mapDeudores[pid].tickets_detalle.push(t);

                globalDeudaTotal += Number(t.saldo_credito);
                globalTicketsTotal += 1;
            });

            dataGlobalCartera = Object.values(mapDeudores);
            dataGlobalCartera.sort((a, b) => b.deuda_total - a.deuda_total); // Ordenar por deuda mayor a menor

            // Actualizar KPIs
            document.getElementById('kpi-deuda-total').textContent = `S/ ${formatMoney(globalDeudaTotal)}`;
            document.getElementById('kpi-proveedores').textContent = dataGlobalCartera.length;
            document.getElementById('kpi-tickets').textContent = globalTicketsTotal;

            renderTabla(dataGlobalCartera);
        }

        function renderTabla(datosAMostrar) {
            const tbody = document.getElementById('tablaDeudores');
            tbody.innerHTML = '';

            if (datosAMostrar.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-gray-500"><i class="fas fa-check-circle text-4xl mb-3 text-emerald-400"></i><p>Felicidades. No tienes deudas pendientes con proveedores.</p></td></tr>`;
                return;
            }

            datosAMostrar.forEach(d => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="font-bold text-slate-800 dark:text-slate-200">${d.razon_social}</td>
                    <td class="text-slate-500 font-mono text-xs">${d.numero_documento}</td>
                    <td class="text-center font-bold text-amber-600 bg-amber-50/50 dark:bg-amber-900/20 rounded-lg border-l-4 border-amber-500">${d.cantidad_tickets}</td>
                    <td class="text-right font-black text-rose-600 text-lg">S/ ${formatMoney(d.deuda_total)}</td>
                    <td class="text-center">
                        <button onclick="verDetalleProveedor('${d.proveedor_id}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 border border-indigo-200 dark:bg-indigo-900/30 dark:border-indigo-800 dark:text-indigo-400 dark:hover:bg-indigo-800/50 px-4 py-2 rounded-lg shadow-sm font-bold text-xs transition-colors flex items-center justify-center gap-2 mx-auto">
                            <i class="fas fa-eye"></i> Gestionar Pagos
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarTabla() {
            const term = document.getElementById('buscadorGlobal').value.toLowerCase();
            if(!term) { renderTabla(dataGlobalCartera); return; }

            const filtrados = dataGlobalCartera.filter(c => 
                c.razon_social.toLowerCase().includes(term) || 
                c.numero_documento.toLowerCase().includes(term)
            );
            renderTabla(filtrados);
        }

        // ==========================================
        //  MODAL: TRAZABILIDAD DEL PROVEEDOR
        // ==========================================
        async function verDetalleProveedor(proveedorId) {
            const proveedor = dataGlobalCartera.find(c => c.proveedor_id === proveedorId);
            if(!proveedor) return;

            let htmlTickets = '';
            
            // Ordenar tickets por fecha (más antiguos primero, por la naturaleza FIFO)
            const ticketsProveedor = [...proveedor.tickets_detalle].sort((a,b) => new Date(a.fecha_ingreso) - new Date(b.fecha_ingreso));

            // Botón superior para realizar un abono o amortización
            let actionBtn = `
                <div class="mb-4">
                    <button onclick="abrirModalAmortizacion('${proveedor.proveedor_id}', '${proveedor.razon_social}', ${proveedor.deuda_total})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md flex justify-center items-center gap-2 transition-colors">
                        <i class="fas fa-hand-holding-usd text-lg"></i> Ingresar Pago a este Proveedor (FIFO)
                    </button>
                    <p class="text-center text-[10px] text-slate-500 mt-1 opacity-75">El sistema distribuirá el pago a las facturas más antiguas primero de forma automática.</p>
                </div>
            `;

            for (let t of ticketsProveedor) {
                // Recuperar pagos asociados a este ticket para mostrarlos en el acordeón
                const { data: pagos } = await window.supabaseClient.from('ingresos_credito_pagos').select('*').eq('ingreso_id', t.id).order('fecha_pago', { ascending: true });
                
                let pagosRow = '';
                if (pagos && pagos.length > 0) {
                    pagos.forEach(p => {
                        pagosRow += `
                            <div class="flex justify-between items-center border-b border-gray-100 dark:border-slate-700/50 py-1.5 px-3 bg-gray-50 dark:bg-slate-800/50 text-[11px] hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors">
                                <div class="text-slate-600 dark:text-slate-400"><i class="fas fa-caret-right text-emerald-500 mr-1"></i> ${new Date(p.fecha_pago).toLocaleDateString('es-PE', {timeZone: 'UTC'})} - ${p.tipo_pago} <span class="bg-white dark:bg-slate-900 border dark:border-slate-700 px-1 rounded ml-1 font-mono text-[9px]">${p.metodo_pago}</span></div>
                                <div class="font-bold text-emerald-600 dark:text-emerald-400">S/ ${formatMoney(p.monto)}</div>
                            </div>
                        `;
                    });
                } else {
                    pagosRow = '<div class="text-[11px] text-slate-400 p-2 italic text-center bg-gray-50 dark:bg-slate-800/50">Sin amortizaciones registradas para este ingreso.</div>';
                }

                // Determinar doc visible
                const docVisual = (t.serie_factura && t.numero_factura) ? `${t.serie_factura}-${t.numero_factura}` : t.numero_ingreso;

                htmlTickets += `
                    <div class="mb-3 border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden bg-white dark:bg-slate-900 shadow-sm">
                        <!-- Cabecera del Ticket -->
                        <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-800 p-3 border-b border-slate-100 dark:border-slate-700">
                            <div>
                                <div class="font-bold text-blue-700 dark:text-blue-400 text-sm"><i class="fas fa-file-invoice mr-1 opacity-50"></i> ${docVisual}</div>
                                <div class="text-[10px] text-slate-500 mt-0.5">${new Date(t.fecha_ingreso).toLocaleDateString('es-PE', { timeZone: 'UTC', year: 'numeric', month: 'short', day: 'numeric'})}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Saldo Adeudado</div>
                                <div class="font-black text-rose-500 text-lg leading-none">S/ ${formatMoney(t.saldo_credito)}</div>
                            </div>
                        </div>
                        
                        <!-- Historial de Pagos -->
                        <div class="border-t border-slate-100 dark:border-slate-700">
                            ${pagosRow}
                        </div>
                    </div>
                `;
            }

            const modalHtml = `
                <div class="text-left">
                    <div class="bg-slate-100 dark:bg-slate-800 p-4 rounded-xl mb-4 border border-slate-200 dark:border-slate-700 flex justify-between items-center shadow-inner">
                        <div>
                            <p class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-1">Razón Social</p>
                            <p class="font-bold text-slate-800 dark:text-slate-200">${proveedor.razon_social}</p>
                            <p class="font-mono text-xs text-slate-500">${proveedor.numero_documento}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs uppercase font-bold text-slate-400 tracking-wider mb-1">Deuda Total</p>
                            <p class="font-black text-rose-600 dark:text-rose-500 text-2xl">S/ ${formatMoney(proveedor.deuda_total)}</p>
                        </div>
                    </div>
                    
                    ${actionBtn}
                    
                    <h4 class="font-bold text-slate-700 dark:text-slate-300 mb-3 text-sm uppercase tracking-wider flex items-center border-b dark:border-slate-700 pb-2 mt-4"><i class="fas fa-layer-group mr-2 text-slate-400"></i> Desglose de Obligaciones (${proveedor.cantidad_tickets})</h4>
                    
                    <div class="max-h-80 overflow-y-auto pr-2 custom-scrollbar">
                        ${htmlTickets}
                    </div>
                </div>
            `;

            Swal.fire({
                title: 'Reporte Analítico del Proveedor',
                html: modalHtml,
                width: 650,
                showConfirmButton: false,
                showCloseButton: true,
                customClass: { popup: 'swal-wide-dark-compatible' }
            });
        }

        // ==========================================
        //  MODAL: REGISTRAR AMORTIZACIÓN
        // ==========================================
        function abrirModalAmortizacion(proveedorId, razonSocial, deudaTotal) {
            Swal.fire({
                title: 'Registrar Pago a Proveedor',
                html: `
                    <div class="text-left mt-2">
                        <p class="text-xs text-slate-500 mb-4 bg-slate-100 dark:bg-slate-800 p-2 rounded border border-slate-200 dark:border-slate-700">
                            Proveedor: <strong class="text-slate-800 dark:text-slate-200">${razonSocial}</strong><br>
                            Deuda Total: <strong class="text-rose-500">S/ ${formatMoney(deudaTotal)}</strong>
                        </p>
                        
                        <div class="mb-3">
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">Monto a Amortizar (S/) *</label>
                            <input type="number" id="pago_monto" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-800 dark:border-slate-600 dark:text-white outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-lg font-bold" placeholder="0.00" step="0.01" max="${deudaTotal}">
                        </div>

                        <div class="mb-3">
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">Fecha de Pago *</label>
                            <input type="date" id="pago_fecha" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-800 dark:border-slate-600 dark:text-white outline-none focus:border-blue-500 transition-all" value="${new Date().toISOString().split('T')[0]}">
                        </div>

                        <div class="mb-3">
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">Método de Pago *</label>
                            <select id="pago_metodo" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-800 dark:border-slate-600 dark:text-white outline-none focus:border-blue-500 transition-all">
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="TRANSFERENCIA">Transferencia Bancaria</option>
                                <option value="YAPE">Yape</option>
                                <option value="PLIN">Plin</option>
                                <option value="CHEQUE">Cheque</option>
                                <option value="TARJETA_CREDITO">Tarjeta de Crédito</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1">Referencia / N° Operación</label>
                            <input type="text" id="pago_ref" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-800 dark:border-slate-600 dark:text-white outline-none focus:border-blue-500 transition-all" placeholder="Ej: OP-123456">
                        </div>
                        
                        <p class="text-[10px] text-emerald-600 dark:text-emerald-400 italic mt-3 text-center"><i class="fas fa-link"></i> Este pago se registrará automáticamente en el Flujo de Caja bajo la categoría "Compras Logística / Inventario".</p>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: '<i class="fas fa-check"></i> Procesar Pago',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#64748b',
                customClass: { popup: 'swal-wide-dark-compatible' },
                preConfirm: () => {
                    const monto = parseFloat(document.getElementById('pago_monto').value);
                    const fecha = document.getElementById('pago_fecha').value;
                    const metodo = document.getElementById('pago_metodo').value;
                    const ref = document.getElementById('pago_ref').value || '-';

                    if (!monto || monto <= 0) {
                        Swal.showValidationMessage('Por favor ingrese un monto válido mayor a 0');
                        return false;
                    }
                    if (monto > deudaTotal) {
                        Swal.showValidationMessage('El monto no puede superar la deuda total');
                        return false;
                    }
                    if (!fecha) {
                        Swal.showValidationMessage('Por favor seleccione la fecha de pago');
                        return false;
                    }

                    return { monto, fecha, metodo, ref };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await ejecutarRPCAmortizacion(proveedorId, result.value);
                } else if(result.dismiss === Swal.DismissReason.cancel) {
                    // Reabrir trazabilidad al cancelar
                    verDetalleProveedor(proveedorId);
                }
            });
        }

        async function ejecutarRPCAmortizacion(proveedorId, datosPago) {
            Swal.fire({
                title: 'Procesando Pago...',
                html: 'Distribuyendo monto en las facturas más antiguas (FIFO) e interconectando con Flujo de Caja.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                // Invocar al RPC (Asegurarse que 0198_crear_estructuras_cuentas_por_pagar.sql ya fue ejecutado)
                const { error } = await window.supabaseClient.rpc('fn_amortizar_credito_proveedor', {
                    p_empresa_id: currentEmpresaId,
                    p_proveedor_id: proveedorId,
                    p_monto: datosPago.monto,
                    p_fecha_pago: datosPago.fecha,
                    p_metodo_pago: datosPago.metodo,
                    p_referencia: datosPago.ref,
                    p_created_by: window.currentUser.nombre || window.currentUser.email
                });

                if (error) throw error;

                await Swal.fire({
                    icon: 'success',
                    title: 'Pago Registrado',
                    text: 'El abono se ha distribuido correctamente y enviado al Flujo de Caja.',
                    confirmButtonColor: '#10b981'
                });

                // Recargar data
                await cargarCarteraDeudores();

            } catch (err) {
                console.error("Error RPC amortización:", err);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Procesamiento',
                    text: 'Hubo un error al registrar la amortización: ' + err.message,
                    confirmButtonColor: '#ef4444'
                });
            }
        }

    </script>
